<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Обновление ссылки JB</title>
</head>

<div id="watch-example">
    <div style="text-align: center;">
        <div>
            <input type="text" v-model="question" placeholder="Request" style="font-size: 24px;" size="50">
            <p style="font-size: 24px;">{{ modifiedString }}</p>
            <input type="text" v-model="consumer" placeholder="Consumer" style="font-size: 24px;" size="50">
            <p style="font-size: 24px;">{{ modifiedStringConsumer }}</p>
            <input type="text" v-model="jb" placeholder="https://plugins.jetbrains.com/" style="font-size: 24px;" size="50">
            <p style="font-size: 24px;" v-html="modifiedJb"></p>
        </div>
    </div>
</div>

<script src="dist/vue.min.js"></script>
<script>
    const watchExampleVM = new Vue({
        el: '#watch-example',
        data: {
            question: '',
            consumer: '',
            jb: '',
        },
        computed: {
            modifiedString() {
                // Замена текста, обернутого в фигурные скобки, на .*
                return 'log_type:nginx AND verb:GET AND request:' + createNginxLogQuery(this.question);
            },
            modifiedStringConsumer() {
                return 'source: /supervisor-events-api-ixc.*/ AND message:/.*| (start|done).*/ AND ctxt_class:/.*' + addBackslashes(this.consumer) + '.*/';
            },
            modifiedJb() {
                return updateJbLink(this.jb);
            },
        }
    });

    function updateJbLink(input) {
        const text = input.trim();
        if (!text) {
            return '';
        }

        // Step 2: JSON from /api/updates/<updateId> pasted into the same field.
        if (text.startsWith('{')) {
            let update;
            try {
                update = JSON.parse(text);
            } catch (e) {
                return 'Не удалось разобрать JSON — скопируйте ответ API целиком';
            }
            if (!update.file) {
                return 'В JSON нет поля "file"';
            }
            const downloadUrl = 'https://downloads.marketplace.jetbrains.com/files/'
                + String(update.file).split('/').map(encodeURIComponent).join('/');
            return `<a href="${downloadUrl}">${downloadUrl}</a>`;
        }

        // Step 1: page URL (.../versions/<channel>/<updateId>) or any URL with ?updateId=<id>.
        // The API has no CORS headers, so the user opens it and pastes the JSON back.
        const match = text.match(/[?&]updateId=(\d+)/) || text.match(/\/versions\/[^/]+\/(\d+)/);
        if (!match) {
            return 'Введите ссылку с updateId, например https://plugins.jetbrains.com/plugin/26071-mcp-server/versions/stable/1185147';
        }

        const apiUrl = `https://plugins.jetbrains.com/api/updates/${match[1]}`;
        return `Откройте <a href="${apiUrl}" target="_blank" rel="noopener noreferrer">${apiUrl}</a>, скопируйте JSON и вставьте его в это поле`;
    }

    function createNginxLogQuery(input) {
        // Разбиваем исходную строку на части
        const parts = input.split('/');

        // Начинаем строку запроса с /.*
        let query = '/.*';

        // Проходим по каждой части URL
        for (let i = 1; i < parts.length; i++) {
            // Заменяем {placeHolder} на .*
            let part = parts[i].replace(/\{.*?\}/g, '.*');

            // Добавляем часть к запросу, заменяя / на \/
            query += '\\/' + part;
        }

        // Добавляем .*/ в конце запроса
        query += '.*/';

        return query;
    }

    function addBackslashes(input) {
        let string = input.replace(/^\\/, '');
        // Используем регулярное выражение /\\/g для поиска всех вхождений обратного слеша
        // и заменяем их на двойной обратный слеш \\
        return string.replace(/\\/g, '\\\\');
    }
</script>
